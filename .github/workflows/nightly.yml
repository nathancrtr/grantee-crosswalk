name: nightly-taggs-snapshot
on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      # Resolving is deliberate, not nightly: the IRS file under it is replaced in place,
      # and a changed EIN should be reviewed before it lands. Run `grantee resolve` by hand.
      - run: grantee taggs
      - name: commit changes
        run: |
          git config user.name "grantee-crosswalk bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: TAGGS snapshot $(date -u +%F)"
          git push
